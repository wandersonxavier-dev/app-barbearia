<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <title>Painel do Barbeiro</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    .header-logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-logo img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f39c12;
    }
    .auth-box, .card-item {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .auth-box {
      margin-top: 20px;
      text-align: center;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin: 6px 0 14px 0;
      background: #2a2a2a;
      border: 1px solid #444;
      color: white;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
      font-family: inherit;
    }
    .btn-main {
      background-color: #f39c12;
      color: #121212;
      border: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }
    .link-toggle {
      color: #f39c12;
      cursor: pointer;
      font-size: 13px;
      margin-top: 14px;
      display: inline-block;
      text-decoration: underline;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .nav-btn {
      flex: 1;
      padding: 10px;
      background: #2a2a2a;
      color: #aaa;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .nav-btn.active {
      background: #f39c12;
      color: #121212;
    }
    .card-item {
      border-left: 4px solid #f39c12;
    }
    .card-item.entregue {
      border-left-color: #2ecc71;
      opacity: 0.85;
    }
    .card-item.cancelado {
      border-left-color: #7f8c8d;
      opacity: 0.5;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }
    .badge-solicitado { background: #e67e22; color: #fff; }
    .badge-entregue { background: #27ae60; color: #fff; }
    .badge-cancelado { background: #7f8c8d; color: #fff; }
    .badge-pendente { background: #c0392b; color: #fff; }
    .badge-pago { background: #2980b9; color: #fff; }
    .itens-lista {
      margin: 12px 0;
      background: #252525;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
    }
    .btn-action {
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-green { background-color: #27ae60; color: white; }
    .btn-danger { background-color: #e74c3c; color: white; }
    .btn-edit { background-color: #3498db; color: white; }
    .btn-share { background-color: #e67e22; color: white; }
    .btn-whatsapp {
      background-color: #25d366;
      color: #121212;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      display: inline-block;
      margin-top: 6px;
    }
    .prod-thumb {
      width: 50px;
      height: 50px;
      border-radius: 6px;
      object-fit: cover;
      background-color: #333;
      margin-right: 12px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- CABEÇALHO -->
  <div class="header-logo">
    <img id="app-logo" src="https://i.imgur.com/LYFvFkx.png" alt="Logo Barbearia">
    <h2 style="margin: 8px 0 0 0; font-size: 18px; color: #f39c12;">Barber Boone</h2>
  </div>

  <!-- AUTENTICAÇÃO -->
  <div id="secao-auth">
    <div id="box-login" class="auth-box">
      <h2>🔐 Acesso do Barbeiro</h2>
      <input type="email" id="login-email" placeholder="Seu e-mail" value="barbeiro@gmail.com">
      <input type="password" id="login-senha" placeholder="Sua senha" value="123">
      <button class="btn-main" id="btn-login" onclick="fazerLogin()">Entrar no Painel</button>
      <br>
      <span class="link-toggle" onclick="alternarTelaAuth('cadastro')">Não tem conta? Cadastre-se aqui</span>
    </div>

    <div id="box-cadastro" class="auth-box" style="display: none;">
      <h2>✂ Criar Conta de Barbeiro</h2>
      <input type="text" id="cad-nome" placeholder="Seu Nome Completo">
      <input type="email" id="cad-email" placeholder="Seu E-mail de Acesso">
      <input type="password" id="cad-senha" placeholder="Crie uma Senha">
      <button class="btn-main" id="btn-cadastrar" onclick="cadastrarBarbeiro()">Criar Minha Conta</button>
      <br>
      <span class="link-toggle" onclick="alternarTelaAuth('login')">Já possui cadastro? Fazer login</span>
    </div>
  </div>

  <!-- PAINEL -->
  <div id="secao-painel" style="display: none;">
    <div class="nav-tabs">
      <button class="nav-btn active" id="tab-pedidos-btn" onclick="alternarAba('pedidos')">📦 Pedidos</button>
      <button class="nav-btn" id="tab-produtos-btn" onclick="alternarAba('produtos')">✂ Produtos & Estoque</button>
    </div>

    <!-- PEDIDOS -->
    <div id="aba-pedidos">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="margin: 0; font-size: 20px;">Pedidos Recebidos</h2>
        <div style="display: flex; gap: 8px;">
          <button class="btn-action" style="background:#444; color:#fff;" onclick="carregarPedidos()">🔄 Atualizar</button>
          <button class="btn-action btn-danger" onclick="fazerLogout()">Sair</button>
        </div>
      </div>
      <div id="lista-pedidos">Carregando pedidos...</div>
    </div>

    <!-- PRODUTOS -->
    <div id="aba-produtos" style="display: none;">
      <div class="card-item" style="border-left-color: #3498db;">
        <h3 id="form-produto-titulo" style="margin-top: 0;">➕ Cadastrar Novo Produto</h3>
        <input type="hidden" id="produto-id">

        <label style="font-size: 13px;">Nome do Produto:</label>
        <input type="text" id="produto-nome" placeholder="Ex: Pomada Efeito Seco">

        <label style="font-size: 13px;">Descrição do Produto:</label>
        <textarea id="produto-descricao" rows="2" placeholder="Ex: Serve para modelar o cabelo e manter o penteado firme por mais tempo."></textarea>

        <label style="font-size: 13px;">Preço (R$):</label>
        <input type="number" step="0.01" id="produto-preco" placeholder="Ex: 35.00">

        <label style="font-size: 13px;">Quantidade em Estoque:</label>
        <input type="number" id="produto-estoque" placeholder="Ex: 10">

        <label style="font-size: 13px; font-weight: bold; display: block; margin-top: 10px;">Foto do Produto:</label>

        <!-- Inputs de arquivo invisíveis -->
        <input type="file" id="input-camera" accept="image/*" capture="environment" style="display: none;" onchange="processarFotoProduto(event)">
        <input type="file" id="input-galeria" accept="image/*" style="display: none;" onchange="processarFotoProduto(event)">

        <!-- Botões para Câmera e Galeria -->
        <div style="display: flex; gap: 10px; margin: 8px 0 12px 0;">
          <button type="button" class="btn-action" style="flex: 1; background-color: #2c3e50; color: white; padding: 10px;" onclick="document.getElementById('input-camera').click()">
            📷 Tirar Foto
          </button>
          <button type="button" class="btn-action" style="flex: 1; background-color: #34495e; color: white; padding: 10px;" onclick="document.getElementById('input-galeria').click()">
            📁 Galeria
          </button>
        </div>

        <!-- Prévia da Foto -->
        <div id="box-preview-foto" style="display: none; text-align: center; margin-bottom: 12px;">
          <img id="preview-foto" src="" alt="Prévia da foto" style="width: 100px; height: 100px; border-radius: 8px; object-fit: cover; border: 2px solid #f39c12; display: inline-block;">
          <br>
          <button type="button" class="btn-action btn-danger" style="margin-top: 6px; padding: 4px 8px; font-size: 11px;" onclick="removerFoto()">❌ Remover Foto</button>
        </div>

        <div style="display: flex; gap: 8px;">
          <button class="btn-main" id="btn-salvar-produto" onclick="salvarProduto()">Salvar Produto</button>
          <button class="btn-action btn-danger" id="btn-cancelar-edicao" style="display: none;" onclick="resetarFormularioProduto()">Cancelar</button>
        </div>
      </div>

      <h3 style="font-size: 18px;">Produtos no Catálogo</h3>
      <div id="lista-produtos">Carregando produtos...</div>
    </div>
  </div>

</div>

<script>
  const API_URL = "https://app-barbearia-api.onrender.com";
  const CATALOGO_BASE_URL = window.location.origin + "/catalogo.html";
  let tokenJWT = localStorage.getItem("token_barbeiro") || "";
  let produtosLocais = [];
  let imagemBase64 = "";

  function alternarTelaAuth(tela) {
    if (tela === "cadastro") {
      document.getElementById("box-login").style.display = "none";
      document.getElementById("box-cadastro").style.display = "block";
    } else {
      document.getElementById("box-login").style.display = "block";
      document.getElementById("box-cadastro").style.display = "none";
    }
  }

  async function cadastrarBarbeiro() {
    const nome = document.getElementById("cad-nome").value.trim();
    const email = document.getElementById("cad-email").value.trim();
    const senha = document.getElementById("cad-senha").value.trim();

    if (!nome || !email || !senha) {
      alert("Por favor, preencha todos os campos.");
      return;
    }

    const btn = document.getElementById("btn-cadastrar");
    btn.innerText = "Criando conta...";
    btn.disabled = true;

    try {
      const response = await fetch(`${API_URL}/auth/cadastro`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, email, senha })
      });

      if (response.ok) {
        alert("Conta criada com sucesso! Faça seu login.");
        document.getElementById("login-email").value = email;
        document.getElementById("login-senha").value = senha;
        alternarTelaAuth("login");
      } else {
        const err = await response.json();
        alert(`Erro: ${err.detail || 'Verifique os dados digitados'}`);
      }
    } catch (e) {
      alert("Erro ao conectar ao servidor.");
    } finally {
      btn.innerText = "Criar Minha Conta";
      btn.disabled = false;
    }
  }

  async function fazerLogin() {
    const email = document.getElementById("login-email").value.trim();
    const senha = document.getElementById("login-senha").value.trim();

    if (!email || !senha) {
      alert("Preencha e-mail e senha.");
      return;
    }

    const btn = document.getElementById("btn-login");
    btn.innerText = "Entrando...";
    btn.disabled = true;

    const formData = new URLSearchParams();
    formData.append("username", email);
    formData.append("password", senha);

    try {
      const response = await fetch(`${API_URL}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData
      });

      if (response.ok) {
        const data = await response.json();
        tokenJWT = data.access_token;
        localStorage.setItem("token_barbeiro", tokenJWT);
        iniciarPainel();
      } else {
        alert("E-mail ou senha incorretos.");
      }
    } catch (e) {
      alert("Erro ao conectar com o servidor.");
    } finally {
      btn.innerText = "Entrar no Painel";
      btn.disabled = false;
    }
  }

  function fazerLogout() {
    localStorage.removeItem("token_barbeiro");
    location.reload();
  }

  function iniciarPainel() {
    document.getElementById("secao-auth").style.display = "none";
    document.getElementById("secao-painel").style.display = "block";
    carregarPedidos();
  }

  function alternarAba(aba) {
    if (aba === "pedidos") {
      document.getElementById("aba-pedidos").style.display = "block";
      document.getElementById("aba-produtos").style.display = "none";
      document.getElementById("tab-pedidos-btn").classList.add("active");
      document.getElementById("tab-produtos-btn").classList.remove("active");
      carregarPedidos();
    } else {
      document.getElementById("aba-pedidos").style.display = "none";
      document.getElementById("aba-produtos").style.display = "block";
      document.getElementById("tab-produtos-btn").classList.add("active");
      document.getElementById("tab-pedidos-btn").classList.remove("active");
      carregarProdutosPainel();
    }
  }

  async function carregarPedidos() {
    try {
      const response = await fetch(`${API_URL}/pedidos`, {
        headers: { "Authorization": `Bearer ${tokenJWT}` }
      });

      if (response.status === 401) {
        alert("Sessão expirada. Faça login novamente.");
        fazerLogout();
        return;
      }

      const pedidos = await response.json();
      renderizarPedidos(pedidos);
    } catch (e) {
      document.getElementById("lista-pedidos").innerHTML = "<p style='color: red;'>Erro ao buscar pedidos.</p>";
    }
  }

  function renderizarPedidos(pedidos) {
    const container = document.getElementById("lista-pedidos");
    if (pedidos.length === 0) {
      container.innerHTML = "<p>Nenhum pedido recebido até o momento.</p>";
      return;
    }

    container.innerHTML = pedidos.map(p => {
      let total = 0;
      const clienteNome = p.cliente ? p.cliente.nome : `Cliente #${p.cliente_id}`;
      const clienteTel = p.cliente ? p.cliente.telefone : "";

      const itensHtml = p.itens.map(item => {
        const subtotal = item.quantidade * item.preco_unitario;
        total += subtotal;
        const nomeProd = item.produto ? item.produto.nome : `Produto #${item.produto_id}`;
        return `<div>• <b>${nomeProd}</b> — ${item.quantidade}x (R$ ${item.preco_unitario.toFixed(2)})</div>`;
      }).join("");

      const isEntregue = p.status_pedido === "entregue";
      const isCancelado = p.status_pedido === "cancelado";
      const msgZap = encodeURIComponent(`Olá ${clienteNome}, seu pedido #${p.id} no valor de R$ ${total.toFixed(2)} está pronto para retirada!`);
      const linkZap = clienteTel ? `https://wa.me/55${clienteTel.replace(/\D/g, '')}?text=${msgZap}` : "#";

      let statusClasse = "";
      if (isEntregue) statusClasse = "entregue";
      if (isCancelado) statusClasse = "cancelado";

      return `
        <div class="card-item ${statusClasse}">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
              <h3 style="margin: 0; font-size: 16px;">Pedido #${p.id} — 👤 ${clienteNome}</h3>
              ${clienteTel && !isCancelado ? `<a href="${linkZap}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>` : ''}
            </div>
            <div style="display: flex; gap: 6px;">
              <span class="badge badge-${p.status_pedido}">${p.status_pedido}</span>
              <span class="badge badge-${p.status_pagamento}" title="Clique para alternar status de pagamento" onclick="alternarStatusPagamento(${p.id}, '${p.status_pagamento}')">${p.status_pagamento} 🔄</span>
            </div>
          </div>
          <div class="itens-lista">
            ${itensHtml}
            <div style="margin-top: 6px; text-align: right; font-weight: bold; color: #f39c12;">Total: R$ ${total.toFixed(2)}</div>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
            <small style="color: #777;">${new Date(p.data_criacao).toLocaleString('pt-BR')}</small>
            <div style="display: flex; gap: 6px;">
              ${!isEntregue && !isCancelado ? `<button class="btn-action btn-green" onclick="entregarPedido(${p.id})">✔ Entregar e Abater Estoque</button>` : ''}
              ${!isCancelado ? `<button class="btn-action btn-danger" onclick="cancelarPedido(${p.id})">✖ Cancelar</button>` : '<span style="color: #7f8c8d; font-weight: bold;">Cancelado</span>'}
              ${isEntregue ? '<span style="color: #2ecc71; font-weight: bold; margin-left: 4px;">✔ Entregue</span>' : ''}
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  async function alternarStatusPagamento(pedidoId, statusAtual) {
    const novoStatus = statusAtual === "pago" ? "pendente" : "pago";
    if (!confirm(`Deseja alterar o pagamento do Pedido #${pedidoId} para '${novoStatus.toUpperCase()}'?`)) return;

    try {
      const response = await fetch(`${API_URL}/pedidos/${pedidoId}/pagamento`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${tokenJWT}`
        },
        body: JSON.stringify({ status_pagamento: novoStatus })
      });

      if (response.ok) {
        carregarPedidos();
      } else {
        const err = await response.json();
        alert(`Erro: ${err.detail || 'Falha ao atualizar pagamento'}`);
      }
    } catch (e) {
      alert("Erro ao conectar com a API.");
    }
  }

  async function entregarPedido(pedidoId) {
    if (!confirm(`Deseja entregar o pedido #${pedidoId} e abater do estoque?`)) return;

    try {
      const response = await fetch(`${API_URL}/pedidos/${pedidoId}/entregar`, {
        method: "PATCH",
        headers: { "Authorization": `Bearer ${tokenJWT}` }
      });

      if (response.ok) {
        carregarPedidos();
        carregarProdutosPainel();
      } else {
        const err = await response.json();
        alert(`Erro: ${err.detail || 'Falha ao atualizar'}`);
      }
    } catch (e) {
      alert("Erro ao conectar com a API.");
    }
  }

  async function cancelarPedido(pedidoId) {
    if (!confirm(`Deseja realmente cancelar o Pedido #${pedidoId}? Se ele já tiver sido entregue, o estoque será devolvido automaticamente.`)) return;

    try {
      const response = await fetch(`${API_URL}/pedidos/${pedidoId}/cancelar`, {
        method: "PATCH",
        headers: { "Authorization": `Bearer ${tokenJWT}` }
      });

      if (response.ok) {
        carregarPedidos();
        carregarProdutosPainel();
      } else {
        const err = await response.json();
        alert(`Erro: ${err.detail || 'Falha ao cancelar pedido'}`);
      }
    } catch (e) {
      alert("Erro ao conectar com a API.");
    }
  }

  async function carregarProdutosPainel() {
    try {
      const response = await fetch(`${API_URL}/produtos/catalogo`);
      produtosLocais = await response.json();
      renderizarProdutosPainel();
    } catch (e) {
      document.getElementById("lista-produtos").innerHTML = "<p style='color: red;'>Erro ao buscar produtos.</p>";
    }
  }

  function renderizarProdutosPainel() {
    const container = document.getElementById("lista-produtos");
    if (produtosLocais.length === 0) {
      container.innerHTML = "<p>Nenhum produto cadastrado.</p>";
      return;
    }

    container.innerHTML = produtosLocais.map(p => {
      const foto = p.imagem_url || "https://i.imgur.com/LYFvFkx.png";
      return `
        <div class="card-item" style="display: flex; justify-content: space-between; align-items: center;">
          <div style="display: flex; align-items: center;">
            <img src="${foto}" class="prod-thumb" alt="${p.nome}" onerror="this.src='https://i.imgur.com/LYFvFkx.png'">
            <div>
              <h4 style="margin: 0 0 2px 0;">${p.nome}</h4>
              ${p.descricao ? `<small style="color: #bbb; display: block; margin-bottom: 4px; font-size: 11px;">${p.descricao}</small>` : ''}
              <span style="color: #2ecc71; font-weight: bold;">R$ ${p.preco.toFixed(2)}</span> |
              <small style="color: #aaa;">Estoque: <b>${p.quantidade_estoque}</b></small>
            </div>
          </div>
          <div style="display: flex; gap: 6px;">
            <button class="btn-action btn-share" title="Compartilhar Link" onclick="compartilharProduto(${p.id}, '${p.nome}', ${p.preco})">🔗 Link</button>
            <button class="btn-action btn-edit" title="Editar Produto" onclick="prepararEdicao(${p.id})">✏</button>
            <button class="btn-action btn-danger" title="Excluir Produto" onclick="excluirProduto(${p.id}, '${p.nome}')">🗑</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function compartilharProduto(id, nome, preco) {
    const link = `${CATALOGO_BASE_URL}?produto=${id}`;
    const texto = `Confira nosso produto *${nome}* por apenas *R$ ${preco.toFixed(2)}* na Barber Boone! Peça pelo link direto: ${link}`;

    if (navigator.share) {
      navigator.share({
        title: nome,
        text: texto,
        url: link
      }).catch(() => {});
    } else {
      navigator.clipboard.writeText(link).then(() => {
        alert(`Link copiado para a área de transferência!\n\n${link}`);
      });
    }
  }

  function removerFoto() {
    imagemBase64 = "";
    document.getElementById("input-camera").value = "";
    document.getElementById("input-galeria").value = "";
    document.getElementById("box-preview-foto").style.display = "none";
  }

  function processarFotoProduto(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.src = e.target.result;
      img.onload = function() {
        const canvas = document.createElement("canvas");
        const maxDim = 400;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          }
        } else {
          if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        imagemBase64 = canvas.toDataURL("image/jpeg", 0.7);

        const preview = document.getElementById("preview-foto");
        preview.src = imagemBase64;
        document.getElementById("box-preview-foto").style.display = "block";
      };
    };
    reader.readAsDataURL(file);
  }

  async function salvarProduto() {
    const id = document.getElementById("produto-id").value;
    const nome = document.getElementById("produto-nome").value.trim();
    const descricao = document.getElementById("produto-descricao").value.trim();
    const preco = parseFloat(document.getElementById("produto-preco").value);
    const estoque = parseInt(document.getElementById("produto-estoque").value);

    if (!nome || isNaN(preco) || isNaN(estoque)) {
      alert("Preencha todos os campos numéricos obrigatórios.");
      return;
    }

    const payload = {
      nome,
      descricao: descricao || null,
      preco,
      quantidade_estoque: estoque,
      imagem_url: imagemBase64 || "https://i.imgur.com/LYFvFkx.png"
    };

    const url = id ? `${API_URL}/produtos/${id}` : `${API_URL}/produtos`;
    const method = id ? "PUT" : "POST";

    const btn = document.getElementById("btn-salvar-produto");
    btn.innerText = "Salvando...";
    btn.disabled = true;

    try {
      const response = await fetch(url, {
        method: method,
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${tokenJWT}`
        },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        alert(id ? "Produto atualizado com sucesso!" : "Produto cadastrado com sucesso!");
        resetarFormularioProduto();
        carregarProdutosPainel();
      } else {
        const err = await response.json();
        alert(`Erro: ${err.detail || 'Não foi possível salvar o produto'}`);
      }
    } catch (e) {
      alert("Erro de conexão ao salvar produto.");
    } finally {
      btn.innerText = id ? "Salvar Alterações" : "Salvar Produto";
      btn.disabled = false;
    }
  }

  async function excluirProduto(id, nome) {
    if (!confirm(`Tem certeza que deseja excluir o produto "${nome}"? Esta ação removerá o item do catálogo dos clientes.`)) {
      return;
    }

    try {
      const response = await fetch(`${API_URL}/produtos/${id}`, {
        method: "DELETE",
        headers: {
          "Authorization": `Bearer ${tokenJWT}`
        }
      });

      if (response.ok) {
        alert("Produto excluído com sucesso!");
        carregarProdutosPainel();
      } else {
        const err = await response.json();
        alert(`Erro ao excluir: ${err.detail || 'Não foi possível remover o produto'}`);
      }
    } catch (e) {
      alert("Erro de conexão ao excluir produto.");
    }
  }

  function prepararEdicao(id) {
    const prod = produtosLocais.find(p => p.id === id);
    if (!prod) return;

    document.getElementById("produto-id").value = prod.id;
    document.getElementById("produto-nome").value = prod.nome;
    document.getElementById("produto-descricao").value = prod.descricao || "";
    document.getElementById("produto-preco").value = prod.preco;
    document.getElementById("produto-estoque").value = prod.quantidade_estoque;

    imagemBase64 = prod.imagem_url || "";
    const boxPreview = document.getElementById("box-preview-foto");
    const preview = document.getElementById("preview-foto");
    if (imagemBase64) {
      preview.src = imagemBase64;
      boxPreview.style.display = "block";
    } else {
      boxPreview.style.display = "none";
    }

    document.getElementById("form-produto-titulo").innerText = "✏ Editar Produto";
    document.getElementById("btn-salvar-produto").innerText = "Salvar Alterações";
    document.getElementById("btn-cancelar-edicao").style.display = "inline-block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetarFormularioProduto() {
    document.getElementById("produto-id").value = "";
    document.getElementById("produto-nome").value = "";
    document.getElementById("produto-descricao").value = "";
    document.getElementById("produto-preco").value = "";
    document.getElementById("produto-estoque").value = "";
    removerFoto();

    document.getElementById("form-produto-titulo").innerText = "➕ Cadastrar Novo Produto";
    document.getElementById("btn-salvar-produto").innerText = "Salvar Produto";
    document.getElementById("btn-cancelar-edicao").style.display = "none";
  }

  if (tokenJWT) {
    iniciarPainel();
  }
</script>
</body>
</html>
