<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Barber Boone</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header-logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-logo img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f39c12;
    }
    h1 {
      text-align: center;
      color: #f39c12;
      font-size: 24px;
      margin: 8px 0 4px 0;
    }
    p.subtitulo {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 24px;
    }

    #produtos-lista {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 600px) {
      #produtos-lista {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (min-width: 850px) {
      #produtos-lista {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
    }

    .card {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      align-items: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
      transition: border 0.3s ease, transform 0.3s ease;
      border: 2px solid transparent;
    }
    .card.destaque-url {
      border: 2px solid #f39c12;
      transform: scale(1.02);
      box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
    }
    .card-img {
      width: 75px;
      height: 75px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #2a2a2a;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .card-info {
      flex: 1;
      min-width: 0;
    }
    .card-info h3 {
      margin: 0;
      font-size: 16px;
      color: #fff;
    }
    .card-info small.descricao {
      color: #aaa;
      display: block;
      margin: 3px 0 6px 0;
      font-size: 12px;
      line-height: 1.35;
      word-wrap: break-word;
    }
    .card-info p {
      margin: 0;
      color: #2ecc71;
      font-weight: bold;
      font-size: 15px;
    }
    .card-info small.estoque {
      color: #888;
      font-size: 11px;
    }
    .card-controls {
      display: flex;
      align-items: center;
      margin-left: 10px;
    }
    .btn-qty {
      background-color: #333;
      color: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .btn-qty:active {
      background-color: #f39c12;
      color: #121212;
    }
    .qty-display {
      margin: 0 8px;
      font-weight: bold;
      font-size: 16px;
      min-width: 16px;
      text-align: center;
    }
    .footer-checkout {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #1e1e1e;
      padding: 16px;
      box-shadow: 0 -3px 15px rgba(0,0,0,0.6);
      text-align: center;
      max-height: 85vh;
      overflow-y: auto;
      z-index: 100;
    }
    .footer-checkout .container {
      max-width: 600px;
    }
    .btn-submit {
      background-color: #f39c12;
      color: #121212;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-submit:active {
      opacity: 0.8;
    }
    .btn-pix-copy {
      background-color: #333;
      color: #f39c12;
      border: 1px solid #f39c12;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      width: 100%;
      cursor: pointer;
      margin-top: 6px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      text-align: left;
      margin-bottom: 8px;
    }
    .form-group {
      margin-bottom: 8px;
      text-align: left;
    }
    .form-group label {
      font-size: 11px;
      color: #aaa;
      display: block;
      margin-bottom: 3px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      background-color: #2a2a2a;
      color: white;
      border: 1px solid #444;
      font-size: 13px;
      box-sizing: border-box;
    }
    .pix-box {
      display: none;
      background: #252525;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 10px;
      border: 1px dashed #f39c12;
    }
    .pix-box img {
      width: 160px;
      height: 160px;
      background: #fff;
      padding: 6px;
      border-radius: 6px;
      margin: 8px 0;
      object-fit: contain;
    }
    .accordion-header {
      background: #252525;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: #f39c12;
      cursor: pointer;
      margin-bottom: 10px;
      text-align: left;
      font-weight: bold;
    }
    .spacer {
      height: 380px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-logo">
    <img src="https://i.imgur.com/LYFvFkx.png" alt="Logo Barbearia">
    <h1>💈 Barber Boone</h1>
    <p class="subtitulo">Faça seu pedido e retire na barbearia</p>
  </div>

  <div id="produtos-lista">Carregando catálogo...</div>
  <div class="spacer"></div>
</div>

<div class="footer-checkout">
  <div class="container">
    <div style="font-weight: bold; color: #f39c12; margin-bottom: 8px; font-size: 14px; text-align: left;">📋 Ficha de Cadastro</div>

    <!-- Campos Principais Obrigatórios -->
    <div class="form-grid">
      <div class="form-group">
        <label for="cliente-nome">Nome Completo *</label>
        <input type="text" id="cliente-nome" placeholder="Ex: Carlos Silva">
      </div>
      <div class="form-group">
        <label for="cliente-telefone">Celular / WhatsApp *</label>
        <input type="tel" id="cliente-telefone" placeholder="Ex: 27999998888">
      </div>
    </div>

    <!-- Sanfona para Dados Complementares da Ficha -->
    <div class="accordion-header" onclick="alternarCamposFicha()">
      ➕ Completar Ficha de Cadastro (Endereço, CPF, RG...) ▾
    </div>

    <div id="ficha-completa" style="display: none;">
      <div class="form-grid">
        <div class="form-group">
          <label>CPF</label>
          <input type="text" id="cliente-cpf" placeholder="000.000.000-00">
        </div>
        <div class="form-group">
          <label>RG</label>
          <input type="text" id="cliente-rg" placeholder="Ex: 1234567-ES">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Data de Nascimento</label>
          <input type="date" id="cliente-nasc">
        </div>
        <div class="form-group">
          <label>Gênero</label>
          <select id="cliente-genero">
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Estado Civil</label>
          <input type="text" id="cliente-estadocivil" placeholder="Ex: Solteiro(a)">
        </div>
        <div class="form-group">
          <label>Profissão</label>
          <input type="text" id="cliente-profissao" placeholder="Ex: Engenheiro">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="cliente-email" placeholder="email@cliente.com">
        </div>
        <div class="form-group">
          <label>Instagram / Redes Sociais</label>
          <input type="text" id="cliente-instagram" placeholder="@seuperfil">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group" style="grid-column: span 2;">
          <label>Endereço Completo</label>
          <input type="text" id="cliente-endereco" placeholder="Rua, Avenida...">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Número</label>
          <input type="text" id="cliente-numero" placeholder="Ex: 120">
        </div>
        <div class="form-group">
          <label>Bairro</label>
          <input type="text" id="cliente-bairro" placeholder="Ex: Centro">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Cidade</label>
          <input type="text" id="cliente-cidade" placeholder="Ex: Vitória">
        </div>
        <div class="form-group">
          <label>CEP</label>
          <input type="text" id="cliente-cep" placeholder="Ex: 29000-000">
        </div>
      </div>
    </div>

    <!-- Pagamento -->
    <div class="form-group">
      <label for="pagamento">Forma de Pagamento:</label>
      <select id="pagamento" onchange="alternarFormaPagamento()">
        <option value="retirada">Pagar na retirada (Dinheiro / Cartão)</option>
        <option value="pix">Pagar agora via PIX</option>
      </select>
    </div>

    <div class="pix-box" id="pix-box">
      <div style="font-size: 13px; font-weight: bold; color: #f39c12;">Escaneie o QR Code ou Copie a Chave:</div>
      <img id="img-pix-qr" src="" alt="QR Code PIX">
      <input type="text" id="pix-key-display" readonly style="text-align: center; font-weight: bold; color: #2ecc71; background: #1a1a1a; font-size: 13px;">
      <button type="button" class="btn-pix-copy" onclick="copiarPix()">📋 Copiar Chave PIX</button>
      <small style="font-size: 11px; color: #888; display: block; margin-top: 6px;">Após pagar, conclua o pedido para enviar o comprovante via WhatsApp.</small>
    </div>

    <button class="btn-submit" id="btn-enviar" onclick="enviarPedido()">Finalizar Pedido (<span id="total-carrinho">R$ 0,00</span>)</button>
  </div>
</div>

<script>
  const API_URL = "https://app-barbearia-api.onrender.com";
  const CHAVE_PIX_BARBEIRO = "27997834019";
  const QR_CODE_PIX_URL = "https://i.imgur.com/fcT4V4s.png";
  const WHATSAPP_BARBEIRO = "5527997834019";

  let produtos = [];
  let carrinho = {};

  // Restaura dados salvos localmente
  document.getElementById("cliente-nome").value = localStorage.getItem("cliente_nome") || "";
  document.getElementById("cliente-telefone").value = localStorage.getItem("cliente_tel") || "";
  document.getElementById("pix-key-display").value = CHAVE_PIX_BARBEIRO;

  function alternarCamposFicha() {
    const box = document.getElementById("ficha-completa");
    box.style.display = box.style.display === "none" ? "block" : "none";
  }

  async function carregarProdutos() {
    try {
      const response = await fetch(`${API_URL}/produtos/catalogo`);
      produtos = await response.json();
      renderizarProdutos();
      verificarParametroUrl();
    } catch (error) {
      document.getElementById("produtos-lista").innerHTML = "<p style='color: red;'>Erro ao carregar catálogo.</p>";
    }
  }

  function renderizarProdutos() {
    const container = document.getElementById("produtos-lista");
    if (produtos.length === 0) {
      container.innerHTML = "<p style='text-align: center; color: #888; grid-column: 1 / -1;'>Nenhum produto disponível no momento.</p>";
      return;
    }

    container.innerHTML = produtos.map(p => {
      const foto = p.imagem_url || "https://i.imgur.com/LYFvFkx.png";
      const esgotado = p.quantidade_estoque <= 0;
      return `
        <div class="card" id="card-prod-${p.id}">
          <img src="${foto}" class="card-img" alt="${p.nome}" onerror="this.src='https://i.imgur.com/LYFvFkx.png'">
          <div class="card-info">
            <h3>${p.nome}</h3>
            ${p.descricao ? `<small class="descricao">${p.descricao}</small>` : ''}
            <p>R$ ${p.preco.toFixed(2)}</p>
            <small class="estoque">${esgotado ? '<span style="color:#e74c3c;">Esgotado</span>' : `Estoque: ${p.quantidade_estoque}`}</small>
          </div>
          ${!esgotado ? `
            <div class="card-controls">
              <button class="btn-qty" onclick="alterarQtd(${p.id}, -1)">-</button>
              <span class="qty-display" id="qty-${p.id}">${carrinho[p.id] || 0}</span>
              <button class="btn-qty" onclick="alterarQtd(${p.id}, 1, ${p.quantidade_estoque})">+</button>
            </div>
          ` : ''}
        </div>
      `;
    }).join("");
  }

  function verificarParametroUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    const prodId = parseInt(urlParams.get('produto'));

    if (prodId) {
      const prod = produtos.find(p => p.id === prodId);
      if (prod && prod.quantidade_estoque > 0) {
        alterarQtd(prodId, 1, prod.quantidade_estoque);
        setTimeout(() => {
          const el = document.getElementById(`card-prod-${prodId}`);
          if (el) {
            el.classList.add('destaque-url');
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 300);
      }
    }
  }

  function alterarQtd(id, delta, maxEstoque) {
    const atual = carrinho[id] || 0;
    const novo = atual + delta;

    if (novo < 0) return;
    if (delta > 0 && novo > maxEstoque) {
      alert(`Quantidade máxima em estoque: ${maxEstoque}`);
      return;
    }

    carrinho[id] = novo;
    const el = document.getElementById(`qty-${id}`);
    if (el) el.innerText = novo;
    atualizarTotal();
  }

  function calcularTotalNumerico() {
    let total = 0;
    produtos.forEach(p => {
      const qtd = carrinho[p.id] || 0;
      total += qtd * p.preco;
    });
    return total;
  }

  function atualizarTotal() {
    const total = calcularTotalNumerico();
    document.getElementById("total-carrinho").innerText = `R$ ${total.toFixed(2)}`;
  }

  function alternarFormaPagamento() {
    const opcao = document.getElementById("pagamento").value;
    const pixBox = document.getElementById("pix-box");

    if (opcao === "pix") {
      pixBox.style.display = "block";
      document.getElementById("img-pix-qr").src = QR_CODE_PIX_URL;
    } else {
      pixBox.style.display = "none";
    }
  }

  function copiarPix() {
    const chave = document.getElementById("pix-key-display").value;
    navigator.clipboard.writeText(chave).then(() => {
      alert("Chave PIX copiada para a área de transferência!");
    });
  }

  async function enviarPedido() {
    const nome = document.getElementById("cliente-nome").value.trim();
    const telefone = document.getElementById("cliente-telefone").value.trim();
    const formaPagamento = document.getElementById("pagamento").value;
    const totalPedido = calcularTotalNumerico();

    if (!nome || !telefone) {
      alert("Preencha Nome e Celular/WhatsApp antes de finalizar.");
      return;
    }

    const itens = Object.keys(carrinho)
      .filter(id => carrinho[id] > 0)
      .map(id => ({
        produto_id: parseInt(id),
        quantidade: carrinho[id]
      }));

    if (itens.length === 0) {
      alert("Adicione pelo menos 1 item ao carrinho.");
      return;
    }

    const btn = document.getElementById("btn-enviar");
    btn.innerText = "Enviando Pedido...";
    btn.disabled = true;

    try {
      localStorage.setItem("cliente_nome", nome);
      localStorage.setItem("cliente_tel", telefone);

      // Coleta dados completos da ficha
      const payloadCliente = {
        nome: nome,
        telefone: telefone,
        cpf: document.getElementById("cliente-cpf")?.value.trim() || null,
        rg: document.getElementById("cliente-rg")?.value.trim() || null,
        data_nascimento: document.getElementById("cliente-nasc")?.value || null,
        genero: document.getElementById("cliente-genero")?.value || null,
        estado_civil: document.getElementById("cliente-estadocivil")?.value.trim() || null,
        profissao: document.getElementById("cliente-profissao")?.value.trim() || null,
        email: document.getElementById("cliente-email")?.value.trim() || null,
        instagram: document.getElementById("cliente-instagram")?.value.trim() || null,
        endereco: document.getElementById("cliente-endereco")?.value.trim() || null,
        numero: document.getElementById("cliente-numero")?.value.trim() || null,
        bairro: document.getElementById("cliente-bairro")?.value.trim() || null,
        cidade: document.getElementById("cliente-cidade")?.value.trim() || null,
        cep: document.getElementById("cliente-cep")?.value.trim() || null
      };

      const respCliente = await fetch(`${API_URL}/clientes`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payloadCliente)
      });

      if (!respCliente.ok) throw new Error("Falha ao registrar cadastro do cliente.");
      const clienteData = await respCliente.json();

      let statusPagamentoBackend = "pendente";
      if (formaPagamento === "fiado") statusPagamentoBackend = "fiado";

      const payloadPedido = {
        cliente_id: clienteData.id,
        status_pagamento: statusPagamentoBackend,
        itens: itens
      };

      const respPedido = await fetch(`${API_URL}/pedidos/publico`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payloadPedido)
      });

      if (respPedido.ok) {
        const ped = await respPedido.json();

        if (formaPagamento === "pix") {
          alert(`🎉 Pedido #${ped.id} registrado! Envie o comprovante pelo WhatsApp.`);
          const msg = encodeURIComponent(`Olá! Fiz o Pedido #${ped.id} no valor de R$ ${totalPedido.toFixed(2)}. Segue o comprovante do PIX:`);
          window.open(`https://wa.me/${WHATSAPP_BARBEIRO}?text=${msg}`, "_blank");
        } else if (formaPagamento === "fiado") {
          alert(`📒 Pedido #${ped.id} registrado no Fiado com sucesso!`);
        } else {
          alert(`🎉 Pedido #${ped.id} registrado com sucesso! Pagamento na retirada.`);
        }

        window.location.href = "/catalogo.html";
      }
    } catch (e) {
      alert(e.message || "Erro ao conectar com o servidor.");
    } finally {
      btn.innerText = "Finalizar Pedido";
      btn.disabled = false;
    }
  }

  carregarProdutos();
</script>
</body>
</html>
